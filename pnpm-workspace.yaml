packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# pnpm 10 does not run dependency build scripts unless they are listed here.
# Prisma needs its postinstall to fetch the query engine used by `prisma generate`.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
