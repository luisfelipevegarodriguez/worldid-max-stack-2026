name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This account's Actions minutes are blocked by billing, so this workflow
# does not currently start. The same commands are what to run locally.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_WORLD_APP_ID: app_staging_build_placeholder
          NEXT_PUBLIC_WORLD_ENVIRONMENT: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000
