name: Deploy World ID Max Stack

on:
  push:
    branches: [main]

# Blocked by Actions billing, same as ci.yml. Production deploy is the Vercel
# project in docs/BOOTSTRAP.md, not this workflow.
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_WORLD_APP_ID: app_staging_build_placeholder
          NEXT_PUBLIC_WORLD_ENVIRONMENT: production
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Deploy apps/web to Vercel
        if: github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          vercel-args: '--prod'
